name: Build and Release Flatpak

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'OpenTubeX release tag (e.g. v0.25.5-beta). Leave empty for latest.'
        required: false
        type: string
  repository_dispatch:
    types: [opentubex-release, opentubex-nightly]

permissions: {}

jobs:
  prepare:
    name: Prepare manifest
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      asset_version: ${{ steps.release.outputs.asset_version }}
      channel: ${{ steps.release.outputs.channel }}
      published_at: ${{ steps.release.outputs.published_at }}

    steps:
      - name: Check out flatpak manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve latest stable metadata tag
        id: stable-metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh api repos/OpenTubeX/OpenTubeX/releases/latest --jq .tag_name)"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta$ ]]; then
            echo "Expected the latest stable release to be a beta tag, got: $tag" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Check out OpenTubeX metadata assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenTubeX/OpenTubeX
          ref: ${{ steps.stable-metadata.outputs.tag }}
          path: opentubex
          persist-credentials: false
          sparse-checkout: |
            _scripts
            _icons/icon.svg
            docs/screenshots
            src/renderer/helpers/releaseNotePlatforms.js

      - name: Resolve OpenTubeX release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag || github.event.client_payload.tag || '' }}
        run: |
          set -euo pipefail

          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="$(gh api repos/OpenTubeX/OpenTubeX/releases/latest --jq .tag_name)"
          fi

          if [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-beta$ ]]; then
            version="${BASH_REMATCH[1]}"
            asset_version="${version}-beta"
            channel=stable
          elif [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+-nightly-[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
            asset_version="$version"
            channel=nightly
          else
            echo "Expected a stable or nightly OpenTubeX tag, got: $tag" >&2
            exit 1
          fi
          published_at="$(gh api "repos/OpenTubeX/OpenTubeX/releases/tags/${tag}" --jq .published_at | cut -dT -f1)"

          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "asset_version=${asset_version}"
            echo "channel=${channel}"
            echo "published_at=${published_at}"
          } >> "$GITHUB_OUTPUT"

      - name: Download portable archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ASSET_VERSION: ${{ steps.release.outputs.asset_version }}
        run: |
          gh release download "$TAG" --repo OpenTubeX/OpenTubeX \
            --pattern "opentubex-${ASSET_VERSION}-linux-x64-portable.zip" \
            --pattern "opentubex-${ASSET_VERSION}-linux-arm64-portable.zip"

      - name: Update manifest checksums
        env:
          TAG: ${{ steps.release.outputs.tag }}
          ASSET_VERSION: ${{ steps.release.outputs.asset_version }}
          STABLE_METADATA_TAG: ${{ steps.stable-metadata.outputs.tag }}
        run: |
          set -euo pipefail

          sha256_x64="$(sha256sum "opentubex-${ASSET_VERSION}-linux-x64-portable.zip" | awk '{print $1}')"
          sha256_arm64="$(sha256sum "opentubex-${ASSET_VERSION}-linux-arm64-portable.zip" | awk '{print $1}')"
          icon_sha256="$(sha256sum opentubex/_icons/icon.svg | awk '{print $1}')"

          yq -i "
            .modules[0].sources[0].url = \"https://github.com/OpenTubeX/OpenTubeX/releases/download/${TAG}/opentubex-${ASSET_VERSION}-linux-x64-portable.zip\" |
            .modules[0].sources[0].sha256 = \"${sha256_x64}\" |
            .modules[0].sources[1].url = \"https://github.com/OpenTubeX/OpenTubeX/releases/download/${TAG}/opentubex-${ASSET_VERSION}-linux-arm64-portable.zip\" |
            .modules[0].sources[1].sha256 = \"${sha256_arm64}\" |
            .modules[0].sources[2].url = \"https://raw.githubusercontent.com/OpenTubeX/OpenTubeX/${STABLE_METADATA_TAG}/_icons/icon.svg\" |
            .modules[0].sources[2].sha256 = \"${icon_sha256}\"
          " org.opentubex.OpenTubeX.yml

      - name: Remove downloaded archives
        env:
          ASSET_VERSION: ${{ steps.release.outputs.asset_version }}
        run: |
          set -euo pipefail
          rm -f \
            "opentubex-${ASSET_VERSION}-linux-x64-portable.zip" \
            "opentubex-${ASSET_VERSION}-linux-arm64-portable.zip"

      - name: Update AppStream release entry
        env:
          VERSION: ${{ steps.release.outputs.version }}
          CHANNEL: ${{ steps.release.outputs.channel }}
          PUBLISHED_AT: ${{ steps.release.outputs.published_at }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xmlstarlet

          appstream_version="$VERSION"
          if [[ "$CHANNEL" == stable ]]; then
            appstream_version="${VERSION}-beta"
          fi

          xmlstarlet ed -L \
            -d "/component/releases/release[1]" \
            -s "/component/releases" -t elem -n release -v "" \
            -i "/component/releases/release[1]" -t attr -n version -v "${appstream_version}" \
            -i "/component/releases/release[1]" -t attr -n date -v "${PUBLISHED_AT}" \
            -s "/component/releases/release[1]" -t elem -n url -v "" \
            -i "/component/releases/release[1]/url" -t attr -n type -v details \
            -s "/component/releases/release[1]/url" -t text -n "" \
              -v "https://github.com/OpenTubeX/OpenTubeX/releases/tag/${TAG}" \
            org.opentubex.OpenTubeX.metainfo.xml

      - name: Add stable release notes to AppStream
        if: steps.release.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          gh api "repos/OpenTubeX/OpenTubeX/releases/tags/${TAG}" --jq .body > "${RUNNER_TEMP}/release-notes.md"
          node opentubex/_scripts/storeReleaseNotes.mjs appstream "${RUNNER_TEMP}/release-notes.md" > "${RUNNER_TEMP}/release-notes.xml"
          python3 - org.opentubex.OpenTubeX.metainfo.xml "${RUNNER_TEMP}/release-notes.xml" <<'EOF'
          import sys
          from pathlib import Path

          metainfo = Path(sys.argv[1])
          notes = Path(sys.argv[2]).read_text().strip().splitlines()
          end = "\n    </release>"
          text = metainfo.read_text()
          if text.count(end) != 1:
              sys.exit("Expected exactly one AppStream release")
          description = "\n".join(["      <description>", *(f"        {line}" for line in notes), "      </description>"])
          metainfo.write_text(text.replace(end, f"\n{description}{end}"))
          EOF

      - name: Update AppStream screenshots
        env:
          STABLE_METADATA_TAG: ${{ steps.stable-metadata.outputs.tag }}
        run: |
          set -euo pipefail
          node opentubex/_scripts/syncAppStreamScreenshots.mjs \
            org.opentubex.OpenTubeX.metainfo.xml \
            "$STABLE_METADATA_TAG"

      - name: Commit manifest updates
        if: steps.release.outputs.channel == 'stable'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add org.opentubex.OpenTubeX.yml org.opentubex.OpenTubeX.metainfo.xml
          if git diff --cached --quiet; then
            echo "Manifest already up to date for ${TAG}, skipping commit."
          else
            git commit --no-verify -m "Update manifest for ${TAG}"
            git push
          fi

      - name: Upload prepared manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifest
          path: |
            org.opentubex.OpenTubeX.yml
            org.opentubex.OpenTubeX.desktop
            org.opentubex.OpenTubeX.metainfo.xml
            run.sh

  build:
    name: Build ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Download prepared manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manifest
          path: .

      - name: Validate Flatpak metadata
        run: |
          set -euo pipefail
          flatpak-builder-lint manifest org.opentubex.OpenTubeX.yml
          flatpak-builder-lint appstream org.opentubex.OpenTubeX.metainfo.xml
          desktop-file-validate org.opentubex.OpenTubeX.desktop

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          arch: ${{ matrix.arch }}
          bundle: org.opentubex.OpenTubeX-${{ matrix.arch }}.flatpak
          build-bundle: ${{ needs.prepare.outputs.channel == 'stable' }}
          manifest-path: org.opentubex.OpenTubeX.yml
          upload-artifact: false
          keep-build-dirs: true
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ needs.prepare.outputs.tag }}

      - name: Upload Flatpak bundle
        if: needs.prepare.outputs.channel == 'stable'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-${{ matrix.arch }}
          path: org.opentubex.OpenTubeX-${{ matrix.arch }}.flatpak
          if-no-files-found: error

      - name: Archive build directory
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mv flatpak_app "build-dir-${ARCH}"
          tar -cpf "build-dir-${ARCH}.tar" "build-dir-${ARCH}"

      - name: Upload build directory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-dir-${{ matrix.arch }}
          path: build-dir-${{ matrix.arch }}.tar
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [prepare, build]
    if: needs.prepare.outputs.channel == 'stable'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Flatpak bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: flatpak-*
          merge-multiple: true

      - name: Rename bundles for release
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mv org.opentubex.OpenTubeX-x86_64.flatpak \
            "org.opentubex.OpenTubeX-${TAG}-x86_64.flatpak"
          mv org.opentubex.OpenTubeX-aarch64.flatpak \
            "org.opentubex.OpenTubeX-${TAG}-aarch64.flatpak"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          notes="Flatpak bundles for [OpenTubeX ${TAG}](https://github.com/OpenTubeX/OpenTubeX/releases/tag/${TAG}).

          Install with:
          \`\`\`bash
          flatpak install --user ./org.opentubex.OpenTubeX-${TAG}-x86_64.flatpak
          # or for ARM64:
          flatpak install --user ./org.opentubex.OpenTubeX-${TAG}-aarch64.flatpak
          \`\`\`"

          if release="$(gh api "repos/${GH_REPO}/releases/tags/${TAG}" 2>&1)"; then
            if jq --exit-status '.immutable == true' <<< "$release" >/dev/null; then
              assets=(
                "org.opentubex.OpenTubeX-${TAG}-x86_64.flatpak"
                "org.opentubex.OpenTubeX-${TAG}-aarch64.flatpak"
              )
              for asset in "${assets[@]}"; do
                if ! jq --exit-status --arg name "$asset" \
                  'any(.assets[]; .name == $name and .state == "uploaded" and .size > 0)' \
                  <<< "$release" >/dev/null; then
                  echo "Immutable release $TAG is missing a complete $asset; publish a new tag." >&2
                  exit 1
                fi
              done
              echo "Keeping the published packages in immutable release $TAG."
              exit 0
            fi
            gh release upload "$TAG" \
              "org.opentubex.OpenTubeX-${TAG}-x86_64.flatpak" \
              "org.opentubex.OpenTubeX-${TAG}-aarch64.flatpak" \
              --repo "$GH_REPO" \
              --clobber
            if jq --exit-status '.draft == true' <<< "$release" >/dev/null; then
              gh release edit "$TAG" --repo "$GH_REPO" --draft=false
            fi
          elif [[ "$release" == *"(HTTP 404)"* ]]; then
            gh release create "$TAG" \
              "org.opentubex.OpenTubeX-${TAG}-x86_64.flatpak" \
              "org.opentubex.OpenTubeX-${TAG}-aarch64.flatpak" \
              --repo "$GH_REPO" \
              --title "OpenTubeX ${VERSION} (Flatpak)" \
              --notes "$notes"
          else
            echo "$release" >&2
            exit 1
          fi

  publish-repo:
    name: Publish OSTree remote
    needs: [prepare, build]
    runs-on: ubuntu-latest

    # Each run restores the live repository and deploys it again, so runs must
    # not overlap. Queue them all instead of canceling a pending release.
    concurrency:
      group: opentubex-flatpak-repository
      queue: max

    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Check out flatpak manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore published OSTree repo
        run: |
          set -euo pipefail
          grep '^GPGKey=' pages/opentubex.flatpakrepo | cut -d= -f2- | base64 -d > "$RUNNER_TEMP/opentubex.gpg"
          ostree init --repo=site/repo --mode=archive-z2
          ostree remote add --repo=site/repo \
            --gpg-import="$RUNNER_TEMP/opentubex.gpg" \
            --set=gpg-verify-summary=true \
            published https://flatpak.opentubex.org/repo
          # The current build and two rollback versions, matching --prune-depth below.
          ostree pull --repo=site/repo --mirror --depth=2 published
          ostree remote delete --repo=site/repo published

      - name: Download x86_64 build directory
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-dir-x86_64
          path: build-dir-x86_64

      - name: Download aarch64 build directory
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-dir-aarch64
          path: build-dir-aarch64

      - name: Extract build directories
        run: |
          set -euo pipefail
          tar -xpf build-dir-x86_64/build-dir-x86_64.tar
          tar -xpf build-dir-aarch64/build-dir-aarch64.tar

      - name: Import Flatpak signing key
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          echo "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --with-fingerprint flatpak@opentubex.org

      - name: Export builds into OSTree repo
        env:
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          FLATPAK_GPG_FINGERPRINT: FCB58AF1F41F6E3157A6496438960E78A4EE5B9C
        run: |
          set -euo pipefail
          channels=("$CHANNEL")
          if [[ "$CHANNEL" == stable ]]; then
            channels+=(nightly)
          fi

          for channel in "${channels[@]}"; do
            flatpak build-export --gpg-sign="$FLATPAK_GPG_FINGERPRINT" --arch=x86_64 \
              site/repo build-dir-x86_64 "$channel"
            flatpak build-export --gpg-sign="$FLATPAK_GPG_FINGERPRINT" --arch=aarch64 \
              site/repo build-dir-aarch64 "$channel"
          done
          # Keep the current build and two rollback versions per ref within GitHub Pages' size limit.
          flatpak build-update-repo --gpg-sign="$FLATPAK_GPG_FINGERPRINT" \
            --default-branch=stable --prune --prune-depth=2 site/repo

          for channel in stable nightly; do
            for arch in x86_64 aarch64; do
              ref="app/org.opentubex.OpenTubeX/${arch}/${channel}"
              if ! ostree rev-parse --repo=site/repo "$ref" >/dev/null 2>&1; then
                echo "Refusing to publish a repository without $ref." >&2
                exit 1
              fi
            done
          done

          ostree fsck --repo=site/repo
          # Clients only read the summary, objects and deltas.
          rm -rf site/repo/tmp

      - name: Assemble GitHub Pages site
        run: cp -r pages/. site/

      - name: Upload GitHub Pages site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
