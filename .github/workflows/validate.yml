name: Validate Flatpak metadata

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate metadata
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate manifest
        run: flatpak-builder-lint manifest org.opentubex.OpenTubeX.yml

      - name: Validate AppStream metadata
        run: flatpak-builder-lint appstream org.opentubex.OpenTubeX.metainfo.xml

      - name: Validate desktop entry
        run: desktop-file-validate org.opentubex.OpenTubeX.desktop
