app-id: org.opentubex.OpenTubeX
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: run.sh
separate-locales: false
finish-args:
  - --require-version=1.16.0
  - --device=dri
  - --device=input
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --filesystem=xdg-download
  - --own-name=org.mpris.MediaPlayer2.opentubex.*
  - --talk-name=org.freedesktop.PowerManagement
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.gnome.SessionManager
  - --talk-name=org.gnome.SettingsDaemon
  - --talk-name=org.kde.KWin
  - --unset-env=ELECTRON_RUN_AS_NODE
modules:
  - name: opentubex
    buildsystem: simple
    sources:
      - type: file
        only-arches:
          - x86_64
        url: https://github.com/OpenTubeX/OpenTubeX/releases/download/v0.38.0-beta/opentubex-0.38.0-beta-linux-x64-portable.zip
        sha256: 2a03f2530017fa3e93107edecb2916f315366d5e8dbc2a78899e52532be6ccf6
      - type: file
        only-arches:
          - aarch64
        url: https://github.com/OpenTubeX/OpenTubeX/releases/download/v0.38.0-beta/opentubex-0.38.0-beta-linux-arm64-portable.zip
        sha256: 0d69b585ff09124d935d94b6eba987a73e7f103c0b3d782e9aea9720abb1f8d4
      - type: file
        url: https://raw.githubusercontent.com/OpenTubeX/OpenTubeX/v0.38.0-beta/_icons/icon.svg
        sha256: 887200bb2efa01d5e389f817b7310faed59a2b7716b97382627f7d8fd03692b5
      - type: file
        path: run.sh
      - type: file
        path: org.opentubex.OpenTubeX.desktop
      - type: file
        path: org.opentubex.OpenTubeX.metainfo.xml
    build-commands:
      - unzip opentubex-*.zip -d /app/opentubex
      - chmod +x /app/opentubex/opentubex
      - install -m755 run.sh /app/bin/
      - install -Dm644 icon.svg /app/share/icons/hicolor/scalable/apps/org.opentubex.OpenTubeX.svg
      - install -Dm644 org.opentubex.OpenTubeX.desktop -t /app/share/applications/
      - install -Dm644 org.opentubex.OpenTubeX.metainfo.xml -t /app/share/metainfo/
      - patch-electron-desktop-filename "${FLATPAK_DEST}"/opentubex/resources/app.asar
