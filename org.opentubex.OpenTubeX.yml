app-id: org.opentubex.OpenTubeX
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: run.sh
separate-locales: false
finish-args:
  - --require-version=1.16.0
  - --device=dri
  - --device=input
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --filesystem=xdg-download
  - --own-name=org.mpris.MediaPlayer2.opentubex.*
  - --talk-name=org.freedesktop.PowerManagement
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.gnome.SessionManager
  - --talk-name=org.gnome.SettingsDaemon
  - --talk-name=org.kde.KWin
  - --unset-env=ELECTRON_RUN_AS_NODE
modules:
  - name: opentubex
    buildsystem: simple
    sources:
      - type: file
        only-arches:
          - x86_64
        url: https://github.com/OpenTubeX/OpenTubeX/releases/download/v0.37.4-beta/opentubex-0.37.4-beta-linux-x64-portable.zip
        sha256: 52b00503b7d84ef0d4f8fbd0eba7695079c0d56d2ab83a97eb94eb5eb3189040
      - type: file
        only-arches:
          - aarch64
        url: https://github.com/OpenTubeX/OpenTubeX/releases/download/v0.37.4-beta/opentubex-0.37.4-beta-linux-arm64-portable.zip
        sha256: 9d6defe42ae985b2b8e15d2076ba83700aa2bcce5bd4846f4598502a1cf381ba
      - type: file
        url: https://raw.githubusercontent.com/OpenTubeX/OpenTubeX/v0.37.4-beta/_icons/icon.svg
        sha256: abb7a193cc7491ffe80752a8c31e8a30bfe14f6dcb790b8220e4fbbf1c01668e
      - type: file
        path: run.sh
      - type: file
        path: org.opentubex.OpenTubeX.desktop
      - type: file
        path: org.opentubex.OpenTubeX.metainfo.xml
    build-commands:
      - unzip opentubex-*.zip -d /app/opentubex
      - chmod +x /app/opentubex/opentubex
      - install -m755 run.sh /app/bin/
      - install -Dm644 icon.svg /app/share/icons/hicolor/scalable/apps/org.opentubex.OpenTubeX.svg
      - install -Dm644 org.opentubex.OpenTubeX.desktop -t /app/share/applications/
      - install -Dm644 org.opentubex.OpenTubeX.metainfo.xml -t /app/share/metainfo/
      - patch-electron-desktop-filename "${FLATPAK_DEST}"/opentubex/resources/app.asar
