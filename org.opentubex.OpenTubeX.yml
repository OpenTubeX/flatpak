app-id: org.opentubex.OpenTubeX
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: run.sh
separate-locales: false
finish-args:
  - --device=dri
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --own-name=org.mpris.MediaPlayer2.chromium.*
  - --own-name=org.mpris.MediaPlayer2.opentubex
  - --talk-name=org.freedesktop.PowerManagement
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.gnome.SessionManager
  - --talk-name=org.gnome.SettingsDaemon
modules:
  - name: opentubex
    buildsystem: simple
    sources:
      - type: file
        only-arches:
          - x86_64
        url: https://github.com/OpenTubeX/OpenTubeX/releases/download/v0.31.2-beta/opentubex-0.31.2-beta-linux-x64-portable.zip
        sha256: 28eb1e96441601666086ba6870da5712a6709e478d10457a04dd563918fe705a
        x-checker-data:
          is-main-source: true
          type: json
          url: https://api.github.com/repos/OpenTubeX/OpenTubeX/releases?per_page=1
          version-query: .[0].tag_name
          url-query: .[0].assets[] | select(.name | endswith("-linux-x64-portable.zip")) | .browser_download_url
          timestamp-query: .[0].published_at
          release-url-template: https://github.com/OpenTubeX/OpenTubeX/releases/tag/$version
      - type: file
        only-arches:
          - aarch64
        url: https://github.com/OpenTubeX/OpenTubeX/releases/download/v0.31.2-beta/opentubex-0.31.2-beta-linux-arm64-portable.zip
        sha256: 947b53c067bf50ff7620a2add8bc7a83a9b9a0105fa4fa3665ebe07534c24cba
        x-checker-data:
          is-main-source: true
          type: json
          url: https://api.github.com/repos/OpenTubeX/OpenTubeX/releases?per_page=1
          version-query: .[0].tag_name
          url-query: .[0].assets[] | select(.name | endswith("-linux-arm64-portable.zip")) | .browser_download_url
          timestamp-query: .[0].published_at
          release-url-template: https://github.com/OpenTubeX/OpenTubeX/releases/tag/$version
      - type: file
        url: https://raw.githubusercontent.com/OpenTubeX/OpenTubeX/development/_icons/icon.svg
        sha256: e1b049358231e105b2b04458ffbc08613674284d7be86a4b00b88cfe46384cb7
      - type: file
        path: run.sh
      - type: file
        path: org.opentubex.OpenTubeX.desktop
      - type: file
        path: org.opentubex.OpenTubeX.metainfo.xml
    build-commands:
      - unzip opentubex-*.zip -d /app/opentubex
      - chmod +x /app/opentubex/opentubex
      - install -m755 run.sh /app/bin/
      - install -Dm644 icon.svg /app/share/icons/hicolor/scalable/apps/org.opentubex.OpenTubeX.svg
      - install -Dm644 org.opentubex.OpenTubeX.desktop -t /app/share/applications/
      - install -Dm644 org.opentubex.OpenTubeX.metainfo.xml -t /app/share/metainfo/
      - patch-electron-desktop-filename "${FLATPAK_DEST}"/opentubex/resources/app.asar
  - name: deno
    buildsystem: simple
    build-commands:
      - install -Dt /app/bin deno
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/denoland/deno/releases/download/v2.9.5/deno-x86_64-unknown-linux-gnu.zip
        sha256: 8b010a3b1a4a0188a67cdb8a7a27348b2a501af78aec7fc74f2ace167368d530
        x-checker-data:
          type: json
          url: https://api.github.com/repos/denoland/deno/releases/latest
          version-query: .tag_name
          url-query: .assets[] | select(.name == "deno-x86_64-unknown-linux-gnu.zip").browser_download_url
      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/denoland/deno/releases/download/v2.9.5/deno-aarch64-unknown-linux-gnu.zip
        sha256: 6b7cae3a8fc4385a59dea3146fcb8bad7fea4230e0ad36a8c692afacbc254be0
        x-checker-data:
          type: json
          url: https://api.github.com/repos/denoland/deno/releases/latest
          version-query: .tag_name
          url-query: .assets[] | select(.name == "deno-aarch64-unknown-linux-gnu.zip").browser_download_url
