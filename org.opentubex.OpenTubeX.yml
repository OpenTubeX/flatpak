app-id: org.opentubex.OpenTubeX
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
command: run.sh
separate-locales: false
finish-args:
  - --require-version=1.16.0
  - --device=dri
  - --device=input
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --own-name=org.mpris.MediaPlayer2.opentubex.*
  - --talk-name=org.freedesktop.PowerManagement
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.gnome.SessionManager
  - --talk-name=org.gnome.SettingsDaemon
  - --unset-env=ELECTRON_RUN_AS_NODE
modules:
  - name: opentubex
    buildsystem: simple
    sources:
      - type: file
        only-arches:
          - x86_64
        url: https://github.com/OpenTubeX/OpenTubeX/releases/download/v0.35.0-beta/opentubex-0.35.0-beta-linux-x64-portable.zip
        sha256: feff6f892f1cf243308542d2ef8c16f7e159470ba6883889d6dc8caddbee3693
        x-checker-data:
          is-main-source: true
          type: json
          url: https://api.github.com/repos/OpenTubeX/OpenTubeX/releases?per_page=100
          version-query: map(select(.prerelease == false and .draft == false))[0].tag_name
          url-query: map(select(.prerelease == false and .draft == false))[0].assets[] | select(.name | endswith("-linux-x64-portable.zip")) | .browser_download_url
          timestamp-query: map(select(.prerelease == false and .draft == false))[0].published_at
          release-url-template: https://github.com/OpenTubeX/OpenTubeX/releases/tag/$version
      - type: file
        only-arches:
          - aarch64
        url: https://github.com/OpenTubeX/OpenTubeX/releases/download/v0.35.0-beta/opentubex-0.35.0-beta-linux-arm64-portable.zip
        sha256: 478c2ee8d2d4d875a462bfe24816f17be73b172157b75fbd7dca0029453f8c0d
        x-checker-data:
          type: json
          url: https://api.github.com/repos/OpenTubeX/OpenTubeX/releases?per_page=100
          version-query: map(select(.prerelease == false and .draft == false))[0].tag_name
          url-query: map(select(.prerelease == false and .draft == false))[0].assets[] | select(.name | endswith("-linux-arm64-portable.zip")) | .browser_download_url
          timestamp-query: map(select(.prerelease == false and .draft == false))[0].published_at
          release-url-template: https://github.com/OpenTubeX/OpenTubeX/releases/tag/$version
      - type: file
        url: https://raw.githubusercontent.com/OpenTubeX/OpenTubeX/v0.35.0-beta/_icons/icon.svg
        sha256: abb7a193cc7491ffe80752a8c31e8a30bfe14f6dcb790b8220e4fbbf1c01668e
      - type: file
        path: run.sh
      - type: file
        path: org.opentubex.OpenTubeX.desktop
      - type: file
        path: org.opentubex.OpenTubeX.metainfo.xml
    build-commands:
      - unzip opentubex-*.zip -d /app/opentubex
      - chmod +x /app/opentubex/opentubex
      - install -m755 run.sh /app/bin/
      - install -Dm644 icon.svg /app/share/icons/hicolor/scalable/apps/org.opentubex.OpenTubeX.svg
      - install -Dm644 org.opentubex.OpenTubeX.desktop -t /app/share/applications/
      - install -Dm644 org.opentubex.OpenTubeX.metainfo.xml -t /app/share/metainfo/
      - patch-electron-desktop-filename "${FLATPAK_DEST}"/opentubex/resources/app.asar
  - name: deno
    buildsystem: simple
    build-commands:
      - install -Dt /app/bin deno
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/denoland/deno/releases/download/v2.9.7/deno-x86_64-unknown-linux-gnu.zip
        sha256: c6527f24f4b16031d3ae4fa9f658d5f11534c8d84ce7dc8502420280919c3490
        x-checker-data:
          type: json
          url: https://api.github.com/repos/denoland/deno/releases/latest
          version-query: .tag_name
          url-query: .assets[] | select(.name == "deno-x86_64-unknown-linux-gnu.zip").browser_download_url
      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/denoland/deno/releases/download/v2.9.7/deno-aarch64-unknown-linux-gnu.zip
        sha256: c832298b1ad4422481334855f6003e0f54145762c5a134f20a489511d2f65bbf
        x-checker-data:
          type: json
          url: https://api.github.com/repos/denoland/deno/releases/latest
          version-query: .tag_name
          url-query: .assets[] | select(.name == "deno-aarch64-unknown-linux-gnu.zip").browser_download_url
